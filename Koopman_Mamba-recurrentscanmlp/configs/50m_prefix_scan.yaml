# Exact prefix-scan 50M configuration.
# Mamba-2 remains at every depth. Four intermediate parallel SKA adapters
# restore meaningful SKA depth without deleting local recurrent mixers.
# Rank 24 is the primary quality/compute compromise; use the r32 config for the
# higher-capacity arm and sparse_diag for the two-block diagnostic control.
d_model: 384
n_layers: 17
vocab_size: 32000
d_state: 64
d_conv: 4
mamba_expand: 2

ska_n_heads: 6
ska_rank: 24
ska_ridge: 0.01
ska_power_K: 1
ska_chunk_size: 64
ska_layer_indices: [3, 7, 11, 15]
ska_mode: parallel
ska_inverse_cholesky: false
ska_exact_intrachunk: false
ska_prefix_scan: true
ska_prefix_scan_block_size: 32
ska_prefix_scan_jitter: 0.0
ska_norm_clip: true
ska_norm_clip_c: 4.0
ska_eta_learnable: false
ska_eta_value: 1.0
ska_eta_bounds: null
ska_gamma_learnable: false
ska_gamma_value: 1.0
ska_gamma_clamp: null
ska_gamma_bounds: null
ska_layerscale: true
ska_layerscale_init: 0.01
ska_out_proj_std: 0.02
ska_short_conv: false

mlp_type: swiglu
mlp_expand: 2.667
norm_type: rmsnorm
norm_eps: 0.00001
init_policy: mamba_safe
initializer_range: 0.02
rescale_prenorm_residual: true
