    <circle cx="100" cy="-4" r="6" fill="#d48a20"/><text x="111" y="0">rank 24</text>
    <circle cx="200" cy="-4" r="6" fill="#3478c5"/><text x="211" y="0">rank 32</text>
    <text x="325" y="0" fill="#556070">Top 15 only; not a full-trial distribution.</text>
