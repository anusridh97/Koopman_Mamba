name: CI

on:
  push:
    branches: [main, jackshi]
  pull_request:
  schedule:
    - cron: "0 7 * * *"   # nightly (UTC) for the GPU smoke job

jobs:
  # CPU gate: numerical correctness + plumbing. No CUDA, no mamba_ssm.
  # Must pass before any training commit (scaling plan Phase 0).
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch + dev extras; mamba_ssm NOT installed)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Import sanity (package must import CPU-only)
        run: python -c "import koopman_lm, eval_harness; print(list(koopman_lm.CONFIG_FACTORIES))"
      - name: Correctness suite (CPU subset, < 2 min)
        run: pytest -m "correctness and not gpu" -q

  # GPU job: full-model parity + bf16 kernels + e2e smoke test.
  # Requires a self-hosted CUDA runner with mamba_ssm/causal-conv1d installed;
  # gated to the nightly schedule / manual dispatch (no hosted CUDA on GH).
  gpu:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Install (CUDA extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cuda]"
      - name: GPU correctness + e2e smoke
        run: pytest -m "gpu" -q
