# Pareto-optimal baseline hyperparameters from Cody's Optuna sweeps
# (branch cody-sweep-baselines, June 2026). Objectives: maximize final_mqar_acc,
# minimize final_wikitext_ppl. Keys parameterize the OLD koopman-lm-fast trainer;
# translate manually before use with the koopman_lm package.

optuna_baseline_1m:
  source: pareto_front.csv
  trials:
