# 100M non-embedding scaling run using the verified FineWeb shard metadata.
extends: 3m-golden.yaml
name: 100m-golden
model: 100m_nonembed
data:
  shard_dir: /anvil/scratch/x-ajohansen/data/fineweb_7b_train
  n_tokens: 7000359047
optim:
  lr: 3.0e-4
  warmup_steps: 2000
  max_steps: 53406
  schedule: cosine
  effective_batch: 64
  weight_decay: 0.1
  grad_clip: 1.0
runtime:
  per_device_batch_size: 8
  time_limit: 3-00:00:00
