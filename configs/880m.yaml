# This config chose the fixed-scalar eta/gamma policy explicitly (above) but
# never opted into causal norm-CLIP, so it inherited the old L2 default. Pinned
# explicitly now that the default is clip: flipping it is a forward-pass change
# that adds no parameters, so param counts cannot detect it. Whether the
# scaling ladder should modernise to clip is a science call, not a refactor.
ska_norm_clip: false
