# Example sweep: ska_rank x lr x seed over the 50m/3B base recipe.
#
# This is the ONLY place this grid is declared. `python -m experimentation.sweep`
# expands it into one materialized RunSpec/spec.yaml per cell (see
# experimentation/sweep/spec.py), and experimentation/run/slurm.py's array job indexes
# into that materialized list for --launcher slurm -- bash never sees
# ska_rank, lr, or seed. This replaces the pattern in the deleted
# scripts/slurm_array.sh, which hardcoded MODEL_TYPES/KV_PAIRS/GAPS in bash
# under a comment reading "must match PAPER_MODEL_TYPES, ... in
# mqar_finetune.py" -- two copies of a grid kept in sync by a comment.
name: ska-rank-lr
base: configs/runs/50m-fineweb-3b.yaml
max_concurrent: 8   # Slurm array %K cap -- see runtime.partition=batch's 16-node ceiling
axes:
  model.ska_rank: [16, 24, 32]
  optim.lr: [2.0e-4, 4.0e-4]
  runtime.seed: [42, 43]
exclude:
  # rank=16 at the higher LR is a known-unstable corner (confirmed in an
  # earlier ad hoc run) -- drop it instead of burning GPU-hours reconfirming
  # it every sweep.
  - model.ska_rank: 16
    optim.lr: 4.0e-4
