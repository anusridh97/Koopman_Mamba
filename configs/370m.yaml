d_model: 1024
n_layers: 28
vocab_size: 32000
d_state: 128
ska_n_heads: 16
ska_rank: 64
ska_layer_indices: [3, 7, 11, 15, 19, 23, 27]
mlp_gated: false

# Legacy eta/gamma policy, pinned explicitly: this config predates the fixed-
# scalar policy and its recorded results depend on the old parameterisation.
ska_eta_learnable: true
ska_eta_value: 1.5
ska_gamma_learnable: true
ska_gamma_clamp: [1.0, 1.5]
ska_layerscale: false
ska_norm_clip: false
