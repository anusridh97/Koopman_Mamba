d_model: 768
n_layers: 24
vocab_size: 32000
d_state: 128
ska_n_heads: 12
ska_rank: 48
# ska_layer_indices matches configs/180m_dense.yaml (its base) -- restored
# 2026-07-06/09 by ati-phase0-refactor's merge to keep this variant
# differing from its base ONLY in mlp_gated, then accidentally regressed
# back to the pre-sync value by the 2026-08-07 "restore lost config YAMLs"
# commit, which pulled from a stale pre-merge snapshot. Fixed again here.
ska_layer_indices: [8, 16]
mlp_gated: true

# Legacy eta/gamma policy, pinned explicitly: this config predates the fixed-
# scalar policy and inherited it by omission until the dataclass defaults were
# inverted. Pinned to keep that inversion behaviour-preserving -- NOT because
# results depend on it: no run of this config has ever completed.
#
# Keep in step with configs/180m_dense.yaml (its base). test_config.py asserts
# this variant differs from that one in mlp_gated ALONE, so any policy change
# here must be made there too or that test fails -- by design.
ska_eta_learnable: true
ska_eta_value: 1.5
ska_gamma_learnable: true
ska_gamma_clamp: [1.0, 1.5]
ska_layerscale: false
ska_norm_clip: false
