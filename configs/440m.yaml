ska_eta_learnable: false
ska_eta_value: 1.0
ska_gamma_learnable: false
ska_gamma_value: 1.0
ska_gamma_clamp: null
ska_layerscale: true
ska_layerscale_init: 0.0001
ska_out_proj_std: 0.02
ska_short_conv: true
ska_short_conv_kernel: 4
d_model: 1024
n_layers: 34
vocab_size: 32000
d_state: 128
ska_n_heads: 16
ska_rank: 96
ska_chunk_size: 96
ska_power_K: 2               # paper K=2; pinned (was implicit dataclass default)
ska_layer_indices: [3, 7, 12, 16, 20, 25, 29, 33]
mlp_gated: false

# This config chose the fixed-scalar eta/gamma policy explicitly (above) but
# never opted into causal norm-CLIP, so it inherited the old L2 default. Pinned
# explicitly now that the default is clip: flipping it is a forward-pass change
# that adds no parameters, so param counts cannot detect it. Whether the
# scaling ladder should modernise to clip is a science call, not a refactor.
ska_norm_clip: false
