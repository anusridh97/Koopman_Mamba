# Echo paper Section 4.1 -- sub-million synthetic transfer experiment.
# Shared by all three Table 2 variants (SSM / SSM+Attn / SSM+SKA).
# d=128, 4 layers, 4 heads, d_state=16, V=128, SwiGLU MLPs.
# SKA at layers 2 and 3 (last two); mamba_only ignores ska_layer_indices.
d_model: 128
n_layers: 4
vocab_size: 128
d_state: 16
d_conv: 4
mamba_expand: 2
ska_n_heads: 4
ska_rank: 24
ska_chunk_size: 16
ska_power_K: 2
ska_ridge: 0.001
ska_layer_indices: [2, 3]
mlp_gated: false
max_seq_len: 4096
tie_embeddings: true

# Legacy eta/gamma policy, pinned explicitly: this config predates the fixed-
# scalar policy and its recorded results DO depend on the old parameterisation.
# Non-negotiable: it is the Echo paper Sec 4.1 config shared by all three
# Table 2 variants, and it is the ONE config here with real captured runs --
# golden_table2_curve.json (capture_job 440057) and golden_mqar_curve.json both
# record model_size "1m". Modernising it turns layerscale on, which changes both
# the architecture and the param count (737,252 -> 737,504), so those two curves
# would no longer be reproducible.
#
# Note the CPU suite would NOT catch that: test_table2_repro_contract.py's
# swiglu_total = 933_732 is a hardcoded GPU-confirmed constant feeding a wide
# [950k, 1050k] band, so it would go silently STALE rather than fail. The
# goldens are the real gate and they run on GPU.
ska_eta_learnable: true
ska_eta_value: 1.5
ska_gamma_learnable: true
ska_gamma_clamp: [1.0, 1.5]
ska_layerscale: false
ska_norm_clip: false
