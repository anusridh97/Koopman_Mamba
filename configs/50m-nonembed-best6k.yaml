# Best 50M Optuna trial (trial 24), promoted to a fresh 6,000-step run.
# Approximately 50M non-embedding parameters; 64.15M total with tied embeddings.
d_model: 416
n_layers: 19
vocab_size: 32000
d_state: 64
d_conv: 4
mamba_expand: 2
ska_n_heads: 8
ska_rank: 32
ska_ridge: 0.005817942288098116
ska_power_K: 1
ska_chunk_size: 64
# `even` placement over the legal interior layers of a 19-layer backbone.
ska_layer_indices: [1, 5, 9, 13, 17]
ska_mode: parallel
ska_backend: pytorch
ska_inverse_cholesky: true
ska_exact_intrachunk: false
ska_prefix_scan: false
ska_prefix_scan_block_size: 32
ska_prefix_scan_jitter: 0.0
ska_norm_clip: true
ska_norm_clip_c: 7.0710678118654755
ska_eta_learnable: false
ska_eta_value: 1.0
ska_eta_bounds: null
ska_gamma_learnable: false
ska_gamma_value: 1.05
ska_gamma_clamp: null
ska_gamma_bounds: null
ska_layerscale: true
ska_layerscale_init: 0.01786992809477544
ska_out_proj_std: 0.02
ska_short_conv: false
mlp_type: swiglu
mlp_expand: 2.667
norm_type: rmsnorm
norm_eps: 0.00001
init_policy: mamba_safe
initializer_range: 0.02
rescale_prenorm_residual: true
max_seq_len: 2048
tie_embeddings: true
compute_precision: bf16
ska_precision: fp32
mlp_precision: null
