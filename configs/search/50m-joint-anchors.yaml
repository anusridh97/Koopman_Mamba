# Anchors for `configs/search/50m-joint-v1.yaml`.
#
# 24 anchors against a 48-trial budget -- half the study, and that split is the
# right one at this size rather than a compromise. Twelve live dimensions over 48
# trials is four trials per dimension, which cannot support a ranking of
# everything. What it CAN support is a measured floor plus a set of one-factor
# contrasts against a fixed backbone, which is exactly what these are; the 24
# sampled trials then explore around them.
#
# ## 1. The noise floor (`reference-k1` .. `reference-k5`)
#
# Five evaluations of ONE configuration differing only in `runtime.seed`. Their
# pooled spread is the smallest difference this study can resolve, and every
# magnitude `analysis.py` prints is stated against it.
#
# This matters more here than at either rung below. At 3M there was no design
# file at all, so `analysis.noise_floor` found no `reference_group`, returned
# nothing, and 2,007 trials produced a ranking with no scale attached -- the floor
# only appeared afterwards by accident, from the Mamba-2 baseline replicates
# (sigma = 0.00142). At 48 trials that failure would be terminal: a screen exists
# to say which of a handful of differences are real, and without a floor it
# cannot say anything.
#
# Five and not two: relative uncertainty on sigma is ~1/sqrt(2(n-1)), so 71% at
# n=2, 41% at n=4, 35% at n=5.
#
# `reference-k1` sets NO `seed:` key -- it inherits the base spec's own seed (42).
# Writing `seed: 42` explicitly is how you collide with a sibling, which
# `check_replicates_resolve` catches at --dry_run.
#
# ## 2. A one-factor-at-a-time screen around the base
#
# Every factor defaults to 1.0 / `baseline`, so a design that sets nothing IS the
# base config and each entry reads as its diff. Anchors are pruning-exempt
# (`wait_for_objective`'s `prune_anchors` defaults False) because they ARE the
# reference population a median pruner compares against -- and with
# `prune_startup_trials: 12`, pruning cannot begin until twelve non-anchor trials
# have COMPLETED.
#
# ## The clamping check, done rather than assumed
#
# Factors are relative and silently CLAMPED into the study's declared space, so a
# factor chosen without checking the bounds quietly becomes a smaller move than
# its name claims -- with nothing in the output saying so.
#
# This bit me while writing these: the base spec first carried `lr: 0.001`, which
# was the FLOOR of the then-placeholder learning_rate range, so `lr_factor` 0.4
# and 0.7 both clamped to 0.001 and the two low-LR anchors would have resolved
# onto the same point as each other AND as the floor. The fix is to keep the base
# LR at the GEOMETRIC CENTRE of the study's range, and the two are COUPLED -- if
# one moves, re-derive this table.
#
# Re-derived now that both ranges are closed from the 10M contrast. The study
# declares learning_rate in [0.0008, 0.009] and the base spec carries
# sqrt(0.0008*0.009) = 0.00268:
#
#     lr_factor 0.3  -> 0.000804  (floor 0.0008)  reaches
#     lr_factor 0.55 -> 0.001474                  reaches
#     lr_factor 1.5  -> 0.004024                  reaches
#     lr_factor 2.2  -> 0.005901                  reaches
#     lr_factor 3.3  -> 0.008844  (ceil  0.009)   reaches
#     layerscale 0.5 -> 0.005     (floor 0.005)   reaches exactly
#     layerscale 20  -> 0.2       (ceil  0.3)     reaches
#
# Five LR factors plus the reference at 1.0 give SIX log-spaced points across an
# 11.25x range, spaced by ~1.8x below centre and ~1.5x above it. The asymmetry is
# deliberate: the optimum sat at the top of the range at BOTH rungs below, so the
# screen is denser where the answer is expected to be.
#
# !! Verify by RESOLVING every design, not by counting them. Clamping is silent
# and invisible in the "24 resolve" line -- that is exactly what hid the base-LR
# bug above.
#
# ## Why every design repeats `placement: late`
#
# Most pinned axes can be left at `baseline` -- `resolve_design` SNAPS them to the
# study's single value. `placement` is one of three that REFUSE rather than snap
# (with `power_K` and `beta_policy`), so `placement: baseline` against a study
# declaring only `['late']` is a hard error at --dry_run. The strictness is right:
# a silently snapped placement would put SKA somewhere the anchor's name does not
# say. `ska_power_K` is left at `baseline` and does snap, because the Design
# default is `baseline` rather than an explicit value.

designs:
  # ---------------------------------------------------------- the noise floor
  - name: reference-k1
    placement: late
    reference_group: reference
  - name: reference-k2
    placement: late
    seed: 43
    reference_group: reference
  - name: reference-k3
    placement: late
    seed: 44
    reference_group: reference
  - name: reference-k4
    placement: late
    seed: 45
    reference_group: reference
  - name: reference-k5
    placement: late
    seed: 46
    reference_group: reference

  # ------------------------------------------------- learning rate (5 points)
  # The dominant axis: 68.6% of global PedANOVA importance at 3M and 70.9% of the
  # variance during random search; a 0.207 swing at 10M, larger than the entire
  # gap between that study's best trial and its untuned reference. It gets the
  # most screen points because the study's own bounds were set by 1/width scaling
  # from one rung below rather than by a measurement AT this rung -- so this
  # screen is the check that the range was centred correctly.
  #
  # Five rather than four, funded by deleting the `beta-one` anchor whose level
  # the 10M contrast refuted. Worth the trade: LR has now been RIGHT-CENSORED at
  # two consecutive rungs (3M at 5.406e-3 of 5.5e-3, 10M at >=0.008), and a third
  # censored measurement would be a methodological failure rather than a result.
  - name: lr-0.3x
    placement: late
    lr_factor: 0.3
  - name: lr-0.55x
    placement: late
    lr_factor: 0.55
  - name: lr-1.5x
    placement: late
    lr_factor: 1.5
  - name: lr-2.2x
    placement: late
    lr_factor: 2.2
  - name: lr-3.3x
    placement: late
    lr_factor: 3.3

  # ------------------------------------------------------- ska_rank (3 points)
  # Floor, the 3M winner, and the study's ceiling. Unchanged after the fill: the
  # choices stayed [8, 16, 24, 32, 48] because 56 and 64 fall OUT of the parameter
  # band at d_model 384, so these three still span floor / previous-winner / top.
  - name: rank-8
    placement: late
    rank: 8
  - name: rank-32
    placement: late
    rank: 32
  - name: rank-48
    placement: late
    rank: 48

  # -------------------------------------------------- n_ska_layers (2 points)
  # layer_factor multiplies the base's 4 SKA layers. 10.9% variance at 3M, where
  # the ordering was 6 > 3 > 4 > 2; the 10M anchors reproduced 6 > 4 > 2 exactly.
  #
  # The low point is 3, not 2: level 2 is no longer declared by the study (the
  # 10M `ska-layers-2` anchor refuted it at +0.02845), and a design naming an
  # undeclared level is a hard error at --dry_run.
  - name: ska-layers-3
    placement: late
    layer_factor: 0.75
  - name: ska-layers-6
    placement: late
    layer_factor: 1.5

  # ------------------------------------------ ska_layerscale_init (3 points)
  # Second-highest LOCAL importance at 3M (0.155) and unresolved there -- the top
  # 12 trials spanned 0.0059 to 0.185, so this screen is doing real work.
  - name: layerscale-0.5x
    placement: late
    layerscale_factor: 0.5
  - name: layerscale-5x
    placement: late
    layerscale_factor: 5.0
  - name: layerscale-20x
    placement: late
    layerscale_factor: 20.0

  # ------------------------------------------------------ beta_policy (2 pts)
  # `learned` is the base, so the other two declared levels are screened. With
  # `ska_rank` this is one of the two orderings the ladder exists to test, and it
  # has now TRANSFERRED twice: the 10M anchors reproduced the 3M ordering exactly
  # (linear, learned, head_scalar, one -- Spearman rho 1.00 over four levels).
  # What collapsed is the magnitude, linear's lead over learned going 0.0202 at 3M
  # to 0.00111 at 10M, which is why the axis is still measured rather than pinned.
  #
  # `beta-one` DELETED: the study no longer declares that level (+0.01798 at 10M,
  # last of four at 3M). Its slot went to the fifth LR anchor.
  - name: beta-head-scalar
    placement: late
    beta_policy: head_scalar
  - name: beta-linear
    placement: late
    beta_policy: linear

  # ----------------------------------------------------- weight_decay (2 pts)
  # 0.0 is no longer declared (+0.02368 at 10M), so the low point is 0.05. 0.15
  # was flat against the 0.1 reference at 10M (+0.00086), which is what makes the
  # top of the range safe to keep rather than a level to chase.
  - name: wd-0.05
    placement: late
    weight_decay: 0.05
  - name: wd-0.15
    placement: late
    weight_decay: 0.15

  # ---------------------------------------------------- warmup_ratio (2 pts)
  # Both points sit ABOVE the base's 0.02, because warmup was the third axis to
  # win at the ceiling of its 10M choices (0.06, -0.01053, resolved). 0.01 is no
  # longer declared (+0.01946), so screening it is neither possible nor useful.
  - name: warmup-0.06
    placement: late
    warmup_ratio: 0.06
  - name: warmup-0.10
    placement: late
    warmup_ratio: 0.10
