# The 180M joint architecture + optimizer search.
#
#     python scripts/search_180m_joint.py configs/search/180m-joint-v1.yaml --dry_run
#
# Fourth and LAST measured rung before extrapolation. The one field that was left
# open -- `learning_rate` -- is now closed by WIDENING to an 18x span that
# contains every live outcome of the 50M measurement, rather than by waiting
# 24-36 h for that measurement. See the learning_rate block for the argument.
#
# ## What this study is
#
# Fourth rung, and the LAST measured one before extrapolation. 24 trials at
# ~60 h each is the budget; what that buys is 14 one-factor anchors against a
# five-replicate floor plus 10 exploratory trials. It is a SCREEN, not a
# ranking: 17 dimensions over 10 sampled trials cannot rank anything, and the
# 10M study showed that once LR is right almost nothing else resolves anyway.
#
# ## Scale, budget, and why this rung leaves the ray
#
# 180M nominal; geometries span 172.2M-185.6M, band 171M-187M. Use the per-trial
# `attr_param_count` in any fit, never the label.
#
#     96 sequences x 2048 tokens x 50862 updates = 9,999,986,688 tokens
#
# 54.7 tokens per TOTAL parameter, against 70 / 65.4 / 65.0 below. DELIBERATE:
# 65 tok/param here is 11.46B against a 10.40B shard (1.10 epochs), 10B is 0.96;
# and 10B is both the Scaling_Echo_3B Phase 2c floor and the Echo paper's own
# 180M budget, so this rung is directly comparable to published numbers. A point
# off the ray is also what an L(N,D) fit needs -- on one ray only a composite
# exponent is identifiable, and 440M/1B/3B extrapolation needs alpha and beta
# separately.
#
# ## Partition: `hero`, and it is FORCED
#
# One trial is 59.9 h at the base geometry (measured 46,372 tok/s at mb12 on
# configs/180m.yaml). `batch` caps at 2-00:00:00, so a single trial does not fit
# it. `hero` allows 30 days. Submit THREE 8-GPU nodes: 24 workers for 24 trials
# is one wave. Two nodes would be two waves and ~5-6 days instead of ~3.
#
name: 180m-joint-v1
base: configs/runs/180m-joint-base.yaml

n_trials: 24
max_steps: 50862

# ------------------------------------------------------------------ sampler
sampler: random
# NO `sampler_startup_trials` key: `sampler: random` has no startup window, and
# StudySpec REFUSES the key with random rather than letting optuna ignore it
# silently -- "the study would look configured when it was not".
#
# Why random and not TPE, which every rung below used. With 24 workers (three
# 8-GPU nodes) all 24 trials start in ONE wave, so no trial has a completed
# trial to learn from. Declaring `tpe_multivariate` here would be, in the
# validator's own words, "a random search that reports itself as TPE" -- and it
# refuses `sampler_startup_trials >= n_trials` for exactly that reason. Two
# nodes would give TPE a second wave to learn from, but at ~60 h per trial that
# is 5 days instead of 2.5, and TPE seeded on 14 one-factor anchors that all
# share one macro geometry was never going to be smart.
#
# The consolation is real: unlike 50M, this rung's 10 sampled trials are an
# UNBIASED sample, so its marginals are not TPE-confounded. With n=10 they will
# resolve almost nothing, but they are honest, and `random` is also the control
# the ladder's TPE studies should be able to beat.
# 6, the floor. With 14 pruning-exempt anchors and 10 sampled trials in a single
# wave, pruning can barely engage at all here -- by the time 6 non-anchor trials
# have COMPLETED the study is essentially over. Kept nonzero so a pathological
# trial can still be cut at step 17800, not as a budget lever.
prune_startup_trials: 6
# Step 6000 of 17100 -- 35%, matching 1200/3400 at 10M and 400/1068 at 3M. Late
# enough that warmup (171-1026 steps at the searched ratios) is long past, which
# matters because pruning inside the transient would rank how fast a config warms
# up rather than how good it is, on a study that searches warmup_ratio.
prune_after_step: 17800
logging_steps: 25

# ------------------------------------------------------------------- fleet
# One trial per GPU, for the reason measured at 10M rather than by default:
# ~200K tok/s is a per-H100 ceiling that does not move with tenancy (2 MPS
# tenants at mb24 gave +14%, 6 at mb6 gave +8%, and 6 without MPS were WORSE
# than one), while memory across this space is heterogeneous enough that static
# tenancy has to fit the worst cell.
#
# Two nodes: submit the same file twice as two 8-GPU jobs. `study_id` hashes this
# file, so both attach to one journal. Launch the second only after the first logs
# `enqueued N anchor(s)` -- two supervisors racing `enqueue_anchors` double-
# enqueue the reference group, and duplicated replicates under `deterministic:
# true` drive sigma toward zero and make every effect look "resolved".
launcher: local
# 2, NOT 8 -- each trial takes FOUR GPUs via DDP, so an 8-GPU node runs two
# trials at once. The driver slices `visible_gpus()` as
# `len(gpus) // concurrent_trials`, so this number and `runtime.gpus` must
# multiply to the node's GPU count or cards sit idle (the driver warns).
#
# 4 GPUs/trial beats 8 on WALL-CLOCK even though 8 makes each trial faster:
# 8 leaves one concurrent trial per node and turns 24 trials into 8 sequential
# waves, where 4 gives 6 concurrent across three nodes and 4 waves.
concurrent_trials: 2
seed: 2026
direction: minimize

# ------------------------------------------------------------------- anchors
# 24 anchors of a 48-trial budget is half, which is deliberate and is the right
# split at this size. A 48-trial TPE study cannot rank 12 dimensions; what it can
# do is measure a floor and a set of one-factor contrasts against a fixed
# backbone, which is exactly what the anchors are. The 24 sampled trials then
# explore around them.
design_file: configs/search/180m-joint-anchors.yaml

# ----------------------------------------------------------- the search space
# 13 axes here + 4 macro axes in the script = 17 declared, five pinned
# singletons, so 12 live. Declared explicitly rather than inherited:
# `restrict_space` is replacement-not-intersection, so an axis this file does not
# mention keeps the REPO's default declaration.
search_axes:
  # ---- SKA architecture -------------------------------------------------
  #
  # CLOSED from the 10M anchor contrast. Rank climbs monotonically and every step
  # is resolved: 8 +0.05954, 24 (reference) 0.0, 32 -0.01239, 48 -0.02731 against
  # a resolvable threshold of 0.00981. So rank had NOT turned over by 48 and the
  # decision table above said to extend upward.
  #
  # !! IT CANNOT BE EXTENDED, and the earlier claim that "56, 64 are in band at
  # d_model 384" was WRONG. Enumerating param_count_estimate over the WHOLE macro
  # space -- expand x tier x d_state x heads x nska, argmax at expand 3 / full /
  # depth 15 / d_state 32 / heads 8 / nska 6 -- against the 45.5M-54.5M band:
  #
  #       rank 32 -> 53,768,472   OK, 731,528 spare
  #       rank 48 -> 54,358,296   OK, 141,704 spare
  #       rank 56 -> 54,653,208   OUT by 153,208
  #       rank 64 -> 54,948,120   OUT by 448,120
  #
  # (`--dry_run` reports the same 54,358,296 as the top of its envelope over 4,320
  # size-bearing combinations, which is the independent check on this table. An
  # earlier version of these figures held d_state at the base 24 and so understated
  # every row; d_state is a MACRO axis and reaches 32.)
  #
  # 48 is the largest rank the band admits at this width. That is a GRANULARITY
  # LIMIT, not a preference, and it means this study will most likely win at its
  # rank ceiling for the third rung running -- state that as a limitation of the
  # ladder rather than reporting 48 as an optimum.
  #
  # Dropping `ska_n_heads: 8` would buy room for 56, and is deliberately NOT done:
  # heads was unresolved at 10M (levels 1 and 2 within 0.0025), and trading a live
  # level for one more point on an axis that is already the study's most expensive
  # cell is a bad exchange.
  ska_rank:
    kind: categorical
    choices: [8, 16, 24, 32, 48]
  # Level 2 DROPPED: the `ska-layers-2` anchor is +0.02845 against a 0.00981
  # threshold, resolvedly worse at 10M, and the 3M marginal ordering agrees
  # (6 > 3 > 4 > 2). Removing a level a clean one-factor contrast has refuted is
  # not the same as pinning the axis -- 3, 4 and 6 all stay live.
  #
  # 6 stays legal: the shallowest geometry here is depth 14, whose usable SKA
  # window is 12 slots, so nothing clamps -- `--dry_run` checks that exhaustively.
  n_ska_layers:
    kind: categorical
    choices: [3, 4, 6]
  # Still searched rather than pinned. The 10M anchors reproduced the 3M ordering
  # EXACTLY -- linear, learned, head_scalar, one at both scales, Spearman rho 1.00
  # over all four levels -- so the ordering transferred. What did NOT transfer is
  # the magnitude: linear's lead over learned went 0.0202 at 3M to 0.00111 at 10M,
  # i.e. under the noise floor. An ordering that survives but whose effect size
  # collapses is a reason to keep measuring the axis, not to pin it.
  #
  # (Read that off the ANCHORS, not the sampled marginals. On TPE marginals this
  # axis scores rho -0.60 between the rungs, because TPE never samples a bad level
  # alongside bad settings -- the same artefact that makes sampled rank-8 look
  # fine at 3.4775 while the clean rank-8 anchor is +0.0595 worse.)
  #
  # Level `one` DROPPED: +0.01798 at 10M, resolvedly worse, and last of four at 3M.
  beta_policy:
    kind: categorical
    choices: [head_scalar, learned, linear]
  # Second-highest LOCAL importance at 3M (0.155) and still unresolved there --
  # the top 12 trials spanned 0.0059 to 0.185.
  ska_layerscale_init:
    kind: float
    low: 0.005
    high: 0.3
    log: true
  # Left searched, not pinned, for the mechanical reason documented at 10M:
  # `fixed_params` rewrites an axis to a one-choice categorical, but
  # `anchors.resolve_design` reads low/high off `ska_ridge` because `ridge_factor`
  # clamps rather than snaps, even at factor 1.0 -- and a degenerate float
  # (low == high) is refused by `StudySpec`. The two rules conflict for any FLOAT
  # axis in an anchored study. It is the least important axis in the 3M study
  # (0.4% variance), so the cost is one nearly-free live dimension.
  ska_ridge:
    kind: float
    low: 0.003
    high: 0.03
    log: true

  # ---- optimizer --------------------------------------------------------
  #
  # The two known points either side of this rung differ 18x, because scale and
  # horizon move the optimum in the same direction:
  #
  #     3M,  1,068 steps  ->  5.406e-3   (our measurement, AT the ceiling)
  #     50M, 22,889 steps ->  3.0e-4     (Ati's golden config)
  #
  # GATE CLOSED BY WIDENING, not by waiting -- and that is the better answer.
  #
  # The plan was to fill this from the 50M `lr-0.3x`..`lr-3.3x` contrast, because
  # LR has been RIGHT-CENSORED at every rung measured so far (3M at 5.406e-3 of a
  # 5.5e-3 ceiling, 10M monotone to >=0.008) and 50M's range was centred by an
  # UNTESTED 1/width rule. But the 50M LR curve needs both nodes and two waves,
  # which is 24-36 h away, and this rung is a ~2.5-day run: waiting would cost
  # more than the measurement is worth.
  #
  # So the range is set wide enough that no outcome of that measurement can
  # invalidate it. sqrt(0.0005 * 0.009) = 0.00212, an 18x span, which contains
  # every live hypothesis:
  #
  #     0.0016   the 1/width prediction, 0.008 * 128/640          INSIDE
  #     0.00268  50M's centre, if width scaling does NOT hold     INSIDE
  #     0.008    10M's censored optimum, if there is NO scaling   INSIDE
  #
  # The cost of a wide range is thinner coverage per sampled trial, and with only
  # 9 random sampled trials that coverage was sparse regardless -- the 5 LR
  # anchors do the real work here, and they span 0.00053..0.00849 (16x) in six
  # log-spaced points counting the reference.
  #
  # THE 50M CONTRAST LANDED, AND IT REFUTES THE 1/width RULE THIS RANGE WAS
  # BUILT ON. All 24 50M anchors are COMPLETE (sigma 0.00582, resolvable
  # 0.01275) and the winner is `lr-3.3x` = 0.008844 -- the TOP of the 50M range,
  # and the best trial in the whole study. 1/width predicted 0.0027 there. It
  # undershot by 3.3x.
  #
  # Worse, the optimum has now been right-censored at every rung:
  #
  #     rung  d_model   ceiling    measured optimum      censored?
  #      3M      64     5.5e-3        5.406e-3            98% of ceiling
  #     10M     128     7.5e-3        7.52e-3             AT the ceiling
  #     50M     384     9.0e-3        8.844e-3            98% of ceiling
  #
  # Three for three. So the honest statement is NOT "optimal LR rises with
  # width" -- that apparent trend is an artefact of my raising the ceiling each
  # rung. It is "we have never once bracketed the optimum," and every reported
  # optimum is a LOWER BOUND.
  #
  # This rung's job is to end that. The range is set so that the LR curve must
  # turn over INSIDE it: two anchor points sit above 9e-3, the highest value any
  # rung has tested. If `lr-3.85x` comes back resolvedly WORSE, the optimum is
  # bracketed for the first time and the 3M/10M/50M numbers can be reported as
  # bounds against a known top. If it wins again, that is a real result too --
  # it says this protocol is LR-limited, not architecture-limited, and that is
  # the finding to publish rather than a fourth censored ceiling.
  #
  # 0.018 is chosen as the ceiling, not higher: it is 2x the highest optimum
  # ever measured, and the 50,862-step horizon here is 3x the 50M horizon, which
  # pushes optimal LR DOWN rather than up. Going further would spend anchors on
  # divergence instead of on the turnover.
  learning_rate:
    kind: float
    low: 0.0012
    high: 0.018
    log: true
  # 0.0 DROPPED: the `wd-0.0` anchor is +0.02368, resolvedly worse. 0.15 was flat
  # against the 0.1 reference (+0.00086), so the top of the range is safe.
  weight_decay:
    kind: categorical
    choices: [0.05, 0.1, 0.15]
  # 0.01 DROPPED (+0.01946, resolvedly worse) and 0.10 ADDED, because 0.06 won at
  # the CEILING of the 10M choices (-0.01053, resolved) -- a third censored axis,
  # and the cheapest of the three to widen.
  warmup_ratio:
    kind: categorical
    choices: [0.02, 0.04, 0.06, 0.10]

# --------------------------------------------------------------- pinned axes
# Each was under 2% variance share inside the 3M good-LR band. A pinned axis costs
# ZERO TPE dimensions -- verified against the installed optuna 4.9.0 that
# `single()` distributions are skipped in `sample_relative` and short-circuited in
# `Trial._suggest` before `sample_independent` -- while still being recorded on
# the trial and snapped to automatically by `anchors.resolve_design`.
fixed_params:
  # 20.8% variance and K=1 won decisively at 3M (4.251 vs 4.419), and it is the
  # cheaper operator. The one axis here pinned to a WINNER rather than a neutral.
  ska_power_K: 1
  # 1.6% variance; `late` had the best mean (4.2559).
  placement: late
  # 0.5% variance -- indistinguishable from noise. Pinned to the neutral value
  # rather than the nominal winner (0.9).
  gamma_value: 1.0
  # 1.3% variance. Neutral; the base spec's own ska_norm_clip_c of 4.0 is
  # reproduced at multiplier 4/sqrt(rank), which varies with the searched rank.
  norm_clip_multiplier: 1.0
  grad_clip: 1.0

# ------------------------------------------------------------------- backend
# The exact inverse-Cholesky route for every trial, as at 3M and 10M, so the
# ladder compares model SIZE and not SKA implementations. NOT `exact_auto`: the
# fused kernel needs rank exactly 24 and value width exactly 64, and this space
# samples several ranks and four head counts, so most of it would fall off a
# performance cliff correlated with two searched variables.
backend_policy: exact_invchol
seq_len: 2048

run_root: /scratch/m000151-pm06/cqiu/study-180m-joint-v1
# HELD OUT and disjoint from the training shard. The default would be the base
# spec's own training data, which would make this a training-loss ranking.
eval_data_dir: /scratch/m000151-pm06/jkli/fineweb_small_val

# 28 hours. Set from the MEASURED 4-GPU corner, with margin for the axis the
# cost model cannot see.
#
# Single-GPU, mb12, exact_invchol, d_model 640:
#     base   (ds24 nska4 H4 rank24)   38.00 GiB   73,766 tok/s
#     corner (ds32 nska6 H4 rank48)   58.66 GiB   34,213 tok/s   -> 81.2 h at 10B
#
# DDP on the corner, effective batch held at 96 (world / tok/s / h for 10B):
#     1 -> 34,229 -> 81.2    2 -> 68,227 -> 40.7
#     4 -> 135,953 -> 20.4   8 -> 265,277 -> 10.5
#
# 99.3% efficiency at world 4, so the corner is 20.4 h and 28 h is a 37% margin.
# That margin is doing real work: the cost model interpolates s/token against
# the SKA term only, and although d_state turned out to be nearly free at this
# width (ds32/nska4/H4/rank24 measured 75,106 tok/s against the base's 73,766),
# `mamba_expand` and `depth_tier` are still unmeasured and both move FLOPs.
#
# The timeout must also stay comfortably under the JOB walltime (48 h on
# `batch`): `wait_for_objective` CANCELS on timeout, and a trial killed by the
# job ending is a trial thrown away.
trial_timeout_seconds: 100800

# On, but NOT the safety net: it fires only on a synchronous submit() raise, and
# a training OOM is asynchronous -- 1,963 of 1,963 trials at 3M ran at the
# initial microbatch and never descended a rung. The protection is
# `runtime.per_device_batch_size` set low up front in the base spec.
batch_ladder: true

# EMPTY, and the script REFUSES a non-empty value: a parameter penalty would be
# computed against a per-trial baseline that IS the trial, so it is identically
# zero.
objective: {}
