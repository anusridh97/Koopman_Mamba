[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koopman_lm"
version = "0.6.0"
description = "Koopman-Mamba language models with an exact fused CUDA SKA prefix scan."
requires-python = ">=3.10"
# Core deps are CUDA-free so `pip install -e .` works on a CPU box (import succeeds;
# building the Mamba2 backbone needs the optional [cuda] extra). Grounded in the
# actual module-level imports of koopman_lm/*.py -- which, since the
# experimentation/ split, are exactly two: torch and yaml. numpy, transformers,
# datasets, wandb and safetensors moved to the [lab] extra; nothing under
# koopman_lm/ imports any of them (the single "wandb" string left in the core is
# a docstring in modules/seq/ska.py, not an import).
dependencies = [
    # torch is intentionally NOT upper-pinned: it must match your CUDA + mamba_ssm
    # build, and no version range here can express that.
    #
    # DO NOT run `pip install -e .` (or `.[cuda,dev]`) directly on a machine
    # that already has a working CUDA torch installed: "install torch first,
    # then pip install -e ." is NOT sufficient -- pip re-resolves this
    # unbounded spec against the default index during the second command and
    # will happily replace your working torch+cu129 build with whatever
    # torch+cu130 (or newer) build the default index prefers, silently
    # breaking CUDA on drivers that only forward-compat within a CUDA major
    # version. This is exactly what killed build 414632 (torch.cuda.is_available()
    # went False after `pip install -e '.[cuda,dev]'` clobbered a working
    # torch+cu129 with a default-index torch+cu130).
    #
    # Use `scripts/setup_env.sh` instead: it installs this project with
    # `--no-deps` (so pip never looks at this dependency list at all) and
    # installs every other declared dependency explicitly, so torch is never
    # a candidate for resolution after the CUDA-enabled build you installed
    # is verified present. It also asserts CUDA is still available afterward
    # and fails loudly if it isn't.
    "torch>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Everything experimentation/ needs and koopman_lm/ does not. Not installed by
# `pip install koopman-lm`: an outsider who wants the model should not inherit
# a wandb account, the HF datasets stack, or a tokenizer download.
#
# experimentation/ itself is not packaged (see packages.find below) -- this
# extra only supplies its third-party dependencies, for running it from a repo
# checkout. Import counts under experimentation/ at the time of the split:
# wandb 35, datasets 17, numpy 13, transformers 12.
lab = [
    "numpy>=1.24",
    "transformers>=4.40,<5.0",   # AutoTokenizer (Llama-2 / Mistral)
    "datasets>=2.18",            # HF datasets for pretokenize + BABILong eval
    # Nothing imports safetensors anywhere in the repo; kept here rather than
    # dropped outright because transformers' save/load paths can reach for it.
    "safetensors",
    "wandb",
    # experimentation/sweep/search/. 4.x is a HARD floor, not caution:
    # study.py::make_storage raises on optuna 3's JournalFileStorage spelling
    # (renamed to journal.JournalFileBackend in 4.0), and constant_liar --
    # which is what keeps N parallel workers from proposing identical points --
    # is 3.2+. Confirmed working against 4.9.0.
    #
    # Only study.py, driver.py and report.py import it. geometry/space/anchors,
    # and StudySpec, stay importable without it, which is what lets a curated
    # anchor set ship as an ordinary `cells:` sweep and a study be authored on a
    # machine that has never installed optuna.
    "optuna>=4.0",
]
# CUDA-only, version-sensitive: pip cannot resolve the CUDA match reliably, so these
# are an explicit extra. Required to instantiate the Mamba2 backbone (model.py) and
# the Mamba-2 backbone. Build against YOUR already-installed torch+CUDA.
cuda = [
    "mamba-ssm>=2.2.2",
    "causal-conv1d>=1.4.0",
    # Use the Triton version bundled with the selected CUDA-enabled PyTorch.
    "ninja>=1.11",
    "packaging>=23",
]
# lm-evaluation-harness pulls a heavy transitive tree (sacrebleu, evaluate,
# sqlitedict, ...) not needed for training or the CPU import-sanity check --
# kept as its own extra rather than folded into [dev].
lmharness = [
    "lm-eval>=0.4.4,<0.5",
]
dev = [
    "pytest>=7.0",
]

# No [project.scripts]. `koopman-train` used to point at
# koopman_lm.training.train:main, but the trainer now lives in
# experimentation/, which is deliberately not installed -- a console script
# into it would resolve at install time and fail at run time. Run the trainer
# as a module from the repo root instead:
#
#     python -m experimentation.training.train --help
#
# which is also exactly what every generated launch.sbatch does (it cd's to
# the repo root first).

[tool.setuptools.packages.find]
include = ["koopman_lm", "koopman_lm.*"]

[tool.uv]
# mamba-ssm / causal-conv1d compile CUDA kernels AGAINST the installed torch, so
# they must build with torch already present -> no isolated build env.
no-build-isolation-package = ["mamba-ssm", "causal-conv1d"]

# With isolation OFF, the build uses whatever is in the env -- a fresh uv venv
# has NO setuptools/wheel/ninja, so the compile would fail. Inject the build
# deps (incl. torch) for exactly these two packages so `uv sync --extra cuda`
# works from a clean env. (These packages' setup.py also tries to fetch a
# matching PREBUILT wheel from GitHub before compiling -- so with network + a
# torch/CUDA combo they publish, no nvcc compile happens at all.)
[tool.uv.extra-build-dependencies]
mamba-ssm = ["torch", "setuptools", "wheel", "ninja", "packaging"]
causal-conv1d = ["torch", "setuptools", "wheel", "ninja", "packaging"]

# Install a CUDA-enabled PyTorch build appropriate for the target GPU before
# installing this project. No wheel index is hard-pinned here because B200 requires
# an SM100-capable build/toolkit.

[tool.pytest.ini_options]
testpaths = ["code-tests"]
# experimentation/ is deliberately NOT installed (packages.find is scoped to
# koopman_lm*), so it is not importable from site-packages the way koopman_lm
# is. Putting the repo root on sys.path is exactly how it resolves in
# production too: every generated launch.sbatch does `cd <repo_root>` before
# `python -m experimentation.training.train`, which puts cwd on sys.path.
pythonpath = ["."]
markers = [
    "correctness: numerical correctness gate (runs in CI before any training commit)",
    "gpu: requires a CUDA device (mamba_ssm backbone / bf16 kernels); auto-skipped on CPU",
    "slow: long-running (e.g. end-to-end smoke test)",
    "jax: requires JAX; reference-oracle parity tests, auto-skipped if jax absent",
]

[tool.setuptools.package-data]
"koopman_lm.kernels" = ["csrc/*.cu"]
