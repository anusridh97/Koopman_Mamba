[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koopman_lm"
version = "0.5.0"
description = "Echo / SKA: Spectral Koopman Attention language model + Koopman MLP. Table 2/3 mixed-objective and Section 5.2 MQAR fine-tuning experiments."
requires-python = ">=3.10"
# Core deps are CUDA-free so `pip install -e .` works on a CPU box (import succeeds;
# building the Mamba2 backbone needs the optional [cuda] extra). Grounded in the
# actual module-level imports of koopman_lm/*.py.
dependencies = [
    # torch is intentionally NOT upper-pinned: it must match your CUDA + mamba_ssm
    # build. Install torch FIRST for your platform, then `pip install -e .`.
    "torch>=2.1",
    "numpy>=1.24",
    "transformers>=4.40,<5.0",   # AutoTokenizer (Llama-2 / Mistral)
    "datasets>=2.18",            # HF datasets for pretokenize + BABILong eval
    "safetensors",
    "wandb",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# CUDA-only, version-sensitive: pip cannot resolve the CUDA match reliably, so these
# are an explicit extra. Required to instantiate the Mamba2 backbone (model.py) and
# the Triton Cholesky kernel (cholesky_update_triton.py). Pin against YOUR torch+CUDA.
cuda = [
    "mamba-ssm>=2.2.2",
    "causal-conv1d>=1.4.0",
    "triton>=2.2",
]
# lm-evaluation-harness pulls a heavy transitive tree (sacrebleu, evaluate,
# sqlitedict, ...) not needed for training or the CPU import-sanity check --
# kept as its own extra rather than folded into [dev].
lmharness = [
    "lm-eval>=0.4.4,<0.5",
]
dev = [
    "pytest>=7.0",
]
nas = [
    "optuna>=4.1,<5",
    "scikit-learn>=1.3,<2",
    "alembic>=1.13",
    "Mako>=1.2",
    "psycopg[binary]>=3.1",
]

[project.scripts]
koopman-table2 = "koopman_lm.experiments.table2:main"
koopman-mqar-finetune = "koopman_lm.experiments.mqar_finetune:main"
koopman-train = "koopman_lm.training.train:main"
koopman-phase2-dry-run = "koopman_lm.experiments.phase2.dry_run:main"
koopman-phase2-preflight = "koopman_lm.experiments.phase2.preflight:main"
koopman-phase2-runtime = "koopman_lm.experiments.phase2.runtime_fingerprint:main"
koopman-phase2-calibration = "koopman_lm.experiments.phase2.calibration:main"
koopman-phase2-pilot = "koopman_lm.experiments.phase2.pilot:main"
koopman-phase2-audit-pilot = "koopman_lm.experiments.phase2.pilot_audit:main"
koopman-phase2-controls = "koopman_lm.experiments.phase2.controls:main"
koopman-phase2-promotions = "koopman_lm.experiments.phase2.promotions:main"
koopman-phase2-analyze = "koopman_lm.experiments.phase2.analysis:main"
koopman-phase2-finalize-report = "koopman_lm.experiments.phase2.reporting_receipts:main"
koopman-phase2-study = "koopman_lm.experiments.phase2.run_study:main"
koopman-phase2-run-manifest = "koopman_lm.experiments.phase2.run_manifest:main"
koopman-phase2-status = "koopman_lm.experiments.phase2.study_status:main"
koopman-phase2-storage-receipt = "koopman_lm.experiments.phase2.storage_snapshot:main"

[tool.setuptools.packages.find]
include = ["koopman_lm", "koopman_lm.*"]

[tool.uv]
# mamba-ssm / causal-conv1d compile CUDA kernels AGAINST the installed torch, so
# they must build with torch already present -> no isolated build env.
no-build-isolation-package = ["mamba-ssm", "causal-conv1d"]

# With isolation OFF, the build uses whatever is in the env -- a fresh uv venv
# has NO setuptools/wheel/ninja, so the compile would fail. Inject the build
# deps (incl. torch) for exactly these two packages so `uv sync --extra cuda`
# works from a clean env. (These packages' setup.py also tries to fetch a
# matching PREBUILT wheel from GitHub before compiling -- so with network + a
# torch/CUDA combo they publish, no nvcc compile happens at all.)
[tool.uv.extra-build-dependencies]
mamba-ssm = ["torch", "setuptools", "wheel", "ninja", "packaging"]
causal-conv1d = ["torch", "setuptools", "wheel", "ninja", "packaging"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true                      # only used by packages that opt in below

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["code-tests"]
markers = [
    "correctness: numerical correctness gate (runs in CI before any training commit)",
    "gpu: requires a CUDA device (mamba_ssm backbone / bf16 kernels); auto-skipped on CPU",
    "slow: long-running (e.g. end-to-end smoke test)",
    "jax: requires JAX; reference-oracle parity tests, auto-skipped if jax absent",
]
